# Configuración para producción en Render (perfil "render").
# Aquí NO van contraseñas: se leen de las variables de entorno de Render.

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ── Correo (Gmail) ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.remitente=${MAIL_USER}
app.contacto.destino=${MAIL_USER}

# ── Correo por API de Brevo (Render bloquea SMTP) ──
# Si BREVO_API_KEY existe, EmailService envía por Brevo; si está vacía, usa Gmail SMTP.
brevo.api.key=${BREVO_API_KEY:}