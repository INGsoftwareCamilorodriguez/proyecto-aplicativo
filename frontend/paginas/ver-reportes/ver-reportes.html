<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CAPCOB - Ver reportes</title>
  <link href="/frontend/paginas/ver-reportes/ver-reportes.css" rel="stylesheet"/>
</head>
<body>
<script src="/frontend/assets/js/guardian-dashboard.js"></script>
<div class="layout">
  <div id="sidebar-root"></div>


  <!-- ══ MAIN ══ -->
  <main class="main">

    <!-- Header -->
    <div class="header-row">
      <div>
        <div class="page-title">Ver reportes</div>
        <div class="page-sub">Accede a los reportes disponibles del sistema.</div>
      </div>
      <div class="logo-badge">
        <div class="licon">
          <img src="/frontend/assets/imagenes/logo-capcob.png" alt="CAPCOB logo" style="width:38px;height:auto;"/>
        </div>
        CAPCOB
      </div>
    </div>

    <div class="stats-grid" style="grid-template-columns:repeat(2,1fr);">
      <a href="/frontend/paginas/registro-venta/registro-venta.html" class="card" style="text-decoration:none;display:flex;flex-direction:column;gap:8px;">
        <div class="stat-label" style="color:var(--text);font-size:.95rem;">Registro de ventas anuales</div>
        <div style="font-size:.78rem;color:var(--muted);">Ventas mes a mes, crecimiento y recibo anual.</div>
      </a>
      <a href="/frontend/paginas/productos-venta/productos-venta.html" class="card" style="text-decoration:none;display:flex;flex-direction:column;gap:8px;">
        <div class="stat-label" style="color:var(--text);font-size:.95rem;">Producto de ventas (gráficos)</div>
        <div style="font-size:.78rem;color:var(--muted);">Comparativo de ventas y participación por producto.</div>
      </a>
    </div>
    <p style="font-size:.78rem;color:var(--muted);">Más reportes próximamente.</p>

  </main>
</div>
<script>
  (function() {
    const rol = localStorage.getItem('rol');
    const username = localStorage.getItem('username');
    if (username) {
      const nameEl = document.querySelector('.user-name');
      if (nameEl) nameEl.textContent = username;
    }
    if (rol !== 'Administrador') {
      document.querySelectorAll('.nav-item').forEach(item => {
        if (item.getAttribute('href') && item.getAttribute('href').includes('getion_usuario')) {
          item.style.display = 'none';
        }
      });
    }
  })();
</script>

  <script src="/frontend/assets/js/sidebar.js"></script>
</body>
</html>
