<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CAPCOB - Gestión de Usuarios</title>
  <link rel="stylesheet" href="/frontend/paginas/gestion-usuario/gestion-usuario.css">
</head>
<body>
<script src="/frontend/assets/js/guardian-dashboard.js"></script>
<div class="layout">

  <!-- ══ SIDEBAR ══ -->
<div id="sidebar-root"></div>
  <!-- ══ MAIN ══ -->
  <main class="main">

    <!-- Header -->
    <div class="header-row">
      <div class="title-wrap">
        <div class="page-title">Gestión de Usuarios</div>
        <div class="page-sub">Administra los usuarios y sus permisos en el sistema.</div>
      </div>
      <div class="logo-badge">
        <img src="/frontend/assets/imagenes/logo-capcob.png" alt="CAPCOB logo"/>
        CAPCOB
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar usuario..." oninput="filtrarUsuarios()"/>
      </div>
      <select class="select-rol" id="rolFilter" onchange="filtrarUsuarios()">
        <option value="">Todos los roles</option>
        <option value="Administrador">Administrador</option>
        <option value="Empleado">Empleado</option>
        <option value="Auditor">Auditor</option>
      </select>
      <button class="btn-add" onclick="abrirModal()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Añadir nuevo usuario
      </button>
    </div>

    <!-- Table -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Email</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="table-footer">
        <div class="footer-info" id="footerInfo"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>

  </main>
</div>

<!-- Modal añadir/editar -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="cerrarModal()">✕</button>
    <h3 id="modalTitle">Añadir nuevo usuario</h3>
    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" id="fNombre" placeholder="Ej: Gabriel Márquez"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="fEmail" placeholder="usuario@example.com"/>
    </div>
    <div class="form-group">
      <label>Rol</label>
      <select id="fRol">
        <option>Administrador</option>
        <option>Empleado</option>
        <option>Auditor</option>
      </select>
    </div>
    <div class="form-group">
      <label>Estado</label>
      <select id="fEstado">
        <option>Activo</option>
        <option>Inactivo</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-save" onclick="guardarUsuario()">Guardar</button>
    </div>
  </div>
</div>
<script src="/frontend/paginas/gestion-usuario/gestion-usuario.js"></script>
  <script src="/frontend/assets/js/sidebar.js"></script>
</body>
</html>
