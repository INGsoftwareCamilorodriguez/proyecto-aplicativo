<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CAPCOB - Gestión de Empleados</title>
  <link rel="stylesheet" href="/frontend/paginas/gestion-usuario/gestion-usuario.css">
  <link rel="stylesheet" href="/frontend/assets/css/tema-panel.css">
  <script src="/frontend/assets/js/tema-panel.js"></script>
  <link rel="stylesheet" href="/frontend/assets/css/marca.css">
  <link rel="stylesheet" href="/frontend/assets/css/responsive.css">
  <link rel="stylesheet" href="/frontend/assets/css/loader.css">
  <script src="/frontend/assets/js/loader.js"></script>
</head>
<body>
<script src="/frontend/assets/js/guardian-dashboard.js"></script>
<div class="layout">

  <!-- ══ SIDEBAR ══ -->
<div id="sidebar-root"></div>
  <!-- ══ MAIN ══ -->
  <main class="main">

    <!-- Header -->
    <div class="header-row">
      <div class="title-wrap">
        <div class="page-title">Gestión de Empleados</div>
        <div class="page-sub">Administra los empleados y sus permisos en el sistema.</div>
      </div>
      <div class="logo-badge">
        <img src="/frontend/assets/imagenes/logo-capcob.png" alt="CAPCOB logo"/>
        CAPCOB
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar empleado por nombre o correo..." oninput="filtrarUsuarios()" autocomplete="off"/>
      </div>
      <button class="btn-add" onclick="abrirModal()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Añadir nuevo empleado
      </button>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Empleado</th>
            <th>Rol</th>
            <th>Identidad</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      </div>
      <div class="table-footer">
        <div class="footer-info" id="footerInfo"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>

  </main>
</div>

<!-- Modal añadir/editar -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="cerrarModal()">✕</button>
    <h3 id="modalTitle">Añadir nuevo empleado</h3>
    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" id="fNombre" placeholder="Ej: Gabriel Márquez"/>
    </div>
    <div class="form-group">
      <label>Identidad (cédula)</label>
      <input type="text" id="fIdentidad" placeholder="Ej: 1075123456" inputmode="numeric" maxlength="30"/>
    </div>
    <div class="form-group">
      <label>Teléfono</label>
      <input type="tel" id="fTelefono" placeholder="Ej: 3001234567" inputmode="tel" maxlength="30"/>
    </div>
    <div class="form-group">
      <label>Correo (acceso del empleado)</label>
      <input type="email" id="fEmail" placeholder="empleado@example.com"/>
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="fPassword" placeholder="Escribe una contraseña"/>
      <small id="fPasswordHint" style="display:none;color:var(--muted, #888);">Déjalo en blanco para no cambiar la contraseña actual.</small>
    </div>
    <div class="form-group">
      <label>Rol</label>
      <select id="fRol">
        
        <option selected>Empleado</option>
      </select>
    </div>
    <div class="form-group">
      <label>Estado</label>
      <select id="fEstado">
        <option>Activo</option>
        <option>Inactivo</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-save" onclick="guardarUsuario()">Guardar</button>
    </div>
  </div>
</div>
<script src="/frontend/assets/js/api-config.js"></script>
<script src="/frontend/assets/js/session-heartbeat.js"></script>
<script src="/frontend/assets/js/tema-marca.js"></script>
<script src="/frontend/paginas/gestion-usuario/gestion-usuario.js"></script>
  <script src="/frontend/assets/js/sidebar.js"></script>
  <script src="/frontend/assets/js/asistente.js"></script>
</body>
</html>
