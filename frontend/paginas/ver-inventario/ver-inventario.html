<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CAPCOB - Ver inventario</title>
  <link href="/frontend/paginas/ver-inventario/ver-inventario.css" rel="stylesheet"/>
</head>
<body>
<script src="/frontend/assets/js/guardian-dashboard.js"></script>
<div class="layout">
  <div id="sidebar-root"></div>


  <!-- ══ MAIN ══ -->
  <main class="main">

    <!-- Header -->
    <div class="header-row">
      <div>
        <div class="page-title">Ver inventario</div>
        <div class="page-sub">Consulta el inventario actual de productos.</div>
      </div>
      <div class="logo-badge">
        <div class="licon">
          <img src="/frontend/assets/imagenes/logo-capcob.png" alt="CAPCOB logo" style="width:38px;height:auto;"/>
        </div>
        CAPCOB
      </div>
    </div>

    <div class="card">
      <div class="card-title">Inventario actual</div>
      <table class="act-table">
        <thead>
          <tr><th>Producto</th><th>Código</th><th>Cantidad</th><th>Precio</th><th>Estado</th></tr>
        </thead>
        <tbody>
          <tr><td>Coca Cola</td><td>770213456</td><td>48</td><td>$3,500</td><td><span class="badge badge-green">Disponible</span></td></tr>
          <tr><td>Pan Bimbo</td><td>770567880</td><td>5</td><td>$7,200</td><td><span class="badge badge-purple">Bajo stock</span></td></tr>
          <tr><td>Leche Alpina</td><td>770112233</td><td>30</td><td>$4,100</td><td><span class="badge badge-green">Disponible</span></td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>
<script src="/frontend/paginas/ver-inventario/ver-inventario.js"></script>

  <script src="/frontend/assets/js/sidebar.js"></script>
</body>
</html>
