<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CAPCOB - Ver inventario</title>
  <link href="/frontend/paginas/ver-inventario/ver-inventario.css" rel="stylesheet"/>
</head>
<body>
<script src="/frontend/assets/js/guardian-dashboard.js"></script>
<div class="layout">
  <div id="sidebar-root"></div>

  <!-- ══ MAIN ══ -->
  <main class="main">

    <!-- Header -->
    <div class="header-row">
      <div>
        <div class="page-title">Ver inventario</div>
        <div class="page-sub">Consulta el inventario actual de productos por paquete.</div>
      </div>
      <div class="logo-badge">
        <div class="licon">
          <img src="/frontend/assets/imagenes/logo-capcob.png" alt="CAPCOB logo" style="width:38px;height:auto;"/>
        </div>
        CAPCOB
      </div>
    </div>

    <!-- Paquetes -->
    <div class="card">
      <div class="card-title">Paquetes</div>
      <div class="paquetes-row" id="paquetesRow">
        <span class="empty-hint">Cargando paquetes...</span>
      </div>
    </div>

    <!-- Inventario -->
    <div class="card">
      <div class="card-title" id="inventarioTitle">Inventario actual</div>
      <p class="empty-hint" id="sinPaqueteHint">Selecciona un paquete arriba para ver su inventario.</p>
      <table class="act-table" id="inventarioTable" style="display:none;">
        <thead>
          <tr><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Precio</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody id="inventarioBody"></tbody>
      </table>
      <p class="empty-hint" id="sinProductosHint" style="display:none;">Este paquete todavía no tiene productos.</p>
    </div>

  </main>
</div>

<!-- Modal código de barras -->
<div class="modal-overlay hidden" id="modalCodigo">
  <div class="modal-box">
    <div class="card-title" id="modalCodigoNombre">Código de barras</div>
    <span class="barcode-tipo" id="modalCodigoTipo"></span>
    <div class="barcode-visual" id="modalCodigoValor"></div>
    <div id="modalCodigoPrecio" style="font-size:.82rem;color:var(--muted);"></div>
    <div class="modal-actions">
      <button class="modal-confirm" id="btnCerrarModalCodigo">Cerrar</button>
    </div>
  </div>
</div>

<script src="/frontend/assets/js/api-config.js"></script>
<script src="/frontend/paginas/ver-inventario/ver-inventario.js"></script>
<script src="/frontend/assets/js/sidebar.js"></script>
</body>
</html>
