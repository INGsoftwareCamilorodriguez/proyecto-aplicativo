<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CAPCOB - Producto de ventas</title>
  <link href="/frontend/paginas/productos-venta/productos-venta.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="/frontend/assets/js/api-config.js"></script>
</head>
<body>
<script src="/frontend/assets/js/guardian-dashboard.js"></script>
<div class="layout">
 
  <!-- ══ SIDEBAR ══ -->
<div id="sidebar-root"></div>
  <!-- ══ MAIN ══ -->
  <main class="main">
 
    <!-- Header -->
    <div class="header-row">
      <div style="display:flex;align-items:center;gap:16px;">
        <div class="title-row">
          <div class="title-bar"></div>
          <div class="page-title">Producto de ventas</div>
        </div>
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="logo-badge">
        <img src="/frontend/assets/imagenes/logo-capcob.png" alt="CAPCOB logo"/>
        CAPCOB
      </div>
    </div>
 
    <!-- Filter tabs + date -->
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
      <div class="filter-tabs">
        <button class="tab active" onclick="setTab(this,'todas')">TODAS LAS VENTAS</button>
        <button class="tab inactive" onclick="setTab(this,'semana')">ESTA SEMANA</button>
        <button class="tab inactive" onclick="setTab(this,'mes')">ESTE MES</button>
        <button class="tab inactive tab-anual" onclick="setTab(this,'anual')">REGISTRO ANUAL</button>
      </div>
    </div>

    <!-- ══ VISTA: GRAFICOS (todas/semana/mes) ══ -->
    <div id="vistaGraficos">

      <!-- Charts row -->
      <div class="charts-grid">
        <!-- Bar chart -->
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <span class="section-label" id="chartLabelBar">TODAS LAS VENTAS</span>
          </div>
          <div class="chart-wrap">
            <canvas id="barChart"></canvas>
          </div>
        </div>

        <!-- Pie chart -->
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <span class="section-label" id="chartLabelPie" style="background:var(--teal);">TODAS LAS VENTAS</span>
          </div>
          <div class="chart-wrap" style="height:200px;">
            <canvas id="pieChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Date range -->
      <div class="date-row">
        <div class="date-pill">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="fechaInicioLabel">--</span>
        </div>
        <span>a</span>
        <div class="date-pill">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="fechaFinLabel">--</span>
        </div>
      </div>

      <!-- Section label -->
      <div>
        <span class="section-label">cantidad y porcentaje de venta</span>
      </div>

      <!-- Product cards (generadas por JS con datos reales) -->
      <div class="products-grid" id="productsGrid">
        <div style="padding:20px;color:var(--muted);font-size:.85rem;">Cargando ventas...</div>
      </div>

    </div>

    <!-- ══ VISTA: REGISTRO DE VENTAS ANUALES (misma tabla/diseño de registro-venta) ══ -->
    <div id="vistaAnual" style="display:none;">

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>MES</th>
              <th>VENTAS</th>
              <th>CRECIMIENTO</th>
              <th>%FRENTE AL<br>MES ANTERIOR</th>
            </tr>
          </thead>
          <tbody id="tableBodyAnual">
            <!-- filas inyectadas por JS -->
          </tbody>
        </table>
      </div>

      <button class="btn-generar" onclick="generarRecibo()">Generar Recibo</button>

    </div>

  </main>

  <!-- Modal recibo anual -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" onclick="cerrarModal()">✕</button>
      <h3>🧾 Recibo Anual</h3>
      <p>Resumen de ventas del año actual</p>
      <div id="modalContent"></div>
      <button class="modal-btn" onclick="window.print()">Imprimir / Guardar PDF</button>
    </div>
  </div>
</div>
 
<script src="/frontend/paginas/productos-venta/productos-venta.js"></script>
  <script src="/frontend/assets/js/sidebar.js"></script>
</body>
</html>
