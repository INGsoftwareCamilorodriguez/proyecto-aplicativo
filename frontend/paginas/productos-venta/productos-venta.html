<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CAPCOB - Producto de ventas</title>
  <link href="/frontend/paginas/productos-venta/productos-venta.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<script src="/frontend/assets/js/guardian-dashboard.js"></script>
<div class="layout">
 
  <!-- ══ SIDEBAR ══ -->
<div id="sidebar-root"></div>
  <!-- ══ MAIN ══ -->
  <main class="main">
 
    <!-- Header -->
    <div class="header-row">
      <div style="display:flex;align-items:center;gap:16px;">
        <div class="title-row">
          <div class="title-bar"></div>
          <div class="page-title">Producto de ventas</div>
        </div>
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="logo-badge">
        <img src="/frontend/assets/imagenes/logo-capcob.png" alt="CAPCOB logo"/>
        CAPCOB
      </div>
    </div>
 
    <!-- Filter tabs + date -->
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
      <div class="filter-tabs">
        <button class="tab active" onclick="setTab(this,'todas')">TODAS LAS VENTAS</button>
        <button class="tab inactive" onclick="setTab(this,'semana')">ESTA SEMANA</button>
        <button class="tab inactive" onclick="setTab(this,'mes')">ESTE MES</button>
      </div>
    </div>
 
    <!-- Charts row -->
    <div class="charts-grid">
      <!-- Bar chart -->
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <span class="section-label">TODAS LAS VENTAS</span>
        </div>
        <div class="chart-wrap">
          <canvas id="barChart"></canvas>
        </div>
      </div>
 
      <!-- Pie chart -->
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <span class="section-label" style="background:var(--teal);">TODAS LAS VENTAS</span>
          <div class="pagination">
            <div class="pg-btn"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div>
            <div class="pg-btn">1</div>
            <div class="pg-btn active">2</div>
            <div class="pg-btn">3</div>
            <div class="pg-btn"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
          </div>
        </div>
        <div class="chart-wrap" style="height:200px;">
          <canvas id="pieChart"></canvas>
        </div>
      </div>
    </div>
 
    <!-- Date range -->
    <div class="date-row">
      <div class="date-pill">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        10 FEB 2026
      </div>
      <span>a</span>
      <div class="date-pill">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        18 FEB 2026
        <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
 
    <!-- Section label -->
    <div>
      <span class="section-label">cantidad y porcentaje de venta</span>
    </div>
 
    <!-- Product cards -->
    <div class="products-grid">
      <div class="product-card">
        <div class="prod-label">Producto 1 - Cantidad:</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="prod-qty">25</div>
          <div class="prod-trend trend-up">
            <span class="trend-icon">📈</span> +150%
          </div>
        </div>
        <div class="prod-price-label">Precio:</div>
        <div class="prod-price">$0</div>
      </div>
 
      <div class="product-card">
        <div class="prod-label">Producto 2 - Cantidad:</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="prod-qty">5</div>
          <div class="prod-trend trend-down">
            <span class="trend-icon">📉</span> -50%
          </div>
        </div>
        <div class="prod-price-label">Precio:</div>
        <div class="prod-price">$0</div>
      </div>
 
      <div class="product-card">
        <div class="prod-label">Producto 3 - Cantidad:</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="prod-qty">12</div>
          <div class="prod-trend trend-up">
            <span class="trend-icon">📈</span> +20%
          </div>
        </div>
        <div class="prod-price-label">Precio:</div>
        <div class="prod-price">$0</div>
      </div>
    </div>
 
  </main>
</div>
 
<script src="/frontend/paginas/productos-venta/productos-venta.js"></script>
  <script src="/frontend/assets/js/sidebar.js"></script>
</body>
</html>
