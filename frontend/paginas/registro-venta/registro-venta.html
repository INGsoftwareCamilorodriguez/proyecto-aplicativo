<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CAPCOB - Registro de ventas Anuales</title>
  <link href="/frontend/paginas/registro-venta/registro-venta.css" rel="stylesheet"/>
</head>
<body>
<script src="/frontend/assets/js/guardian-dashboard.js"></script>
<div class="layout">
  <!-- ══ SIDEBAR ══ -->
  <div id="sidebar-root"></div>

  <!-- ══ MAIN ══ -->
  <main class="main">

    <!-- Header -->
    <div class="header-row">
      <div style="display:flex;align-items:center;gap:16px;">
        <div class="title-row">
          <div class="title-bar"></div>
          <div class="page-title">Registro de ventas Anuales</div>
        </div>
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="logo-badge">
        <img src="/frontend/assets/imagenes/logo-capcob.png" alt="CAPCOB logo"/>
        CAPCOB
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>MES</th>
            <th>VENTAS</th>
            <th>CRECIMIENTO</th>
            <th>%FRENTE AL<br>MES ANTERIOR</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- rows injected by JS -->
        </tbody>
      </table>
    </div>

    <!-- Generar recibo -->
    <button class="btn-generar" onclick="generarRecibo()">Generar Recibo</button>

  </main>
</div>

<!-- Modal recibo -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="cerrarModal()">✕</button>
    <h3>🧾 Recibo Anual</h3>
    <p>Resumen de ventas del año actual</p>
    <div id="modalContent"></div>
    <button class="modal-btn" onclick="window.print()">Imprimir / Guardar PDF</button>
  </div>
</div>

<script src="registro-venta.js"></script>
  <script src="/frontend/assets/js/sidebar.js"></script>
</body>
</html>
