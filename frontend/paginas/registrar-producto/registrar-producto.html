<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CAPCOB - Registrar producto</title>
  <link href="/frontend/paginas/registrar-producto/registrar-producto.css" rel="stylesheet"/>
</head>
<body>
  <script src="/frontend/assets/js/guardian-dashboard.js"></script>
<div class="layout">
  <div id="sidebar-root"></div>


  <!-- ══ MAIN ══ -->
  <main class="main">

    <!-- Header -->
    <div class="header-row">
      <div>
        <div class="page-title">Registrar producto</div>
        <div class="page-sub">Añade nuevos productos al inventario.</div>
      </div>
      <div class="logo-badge">
        <div class="licon">
          <img src="/frontend/assets/imagenes/logo-capcob.png" alt="CAPCOB logo" style="width:38px;height:auto;"/>
        </div>
        CAPCOB
      </div>
    </div>

    <div class="card" style="max-width:640px;">
      <div class="card-title">Datos del producto</div>
      <form onsubmit="return false;" style="display:flex;flex-direction:column;gap:14px;">
        <div>
          <label style="font-size:.75rem;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;">NOMBRE DEL PRODUCTO</label>
          <input type="text" placeholder="Ej: Coca Cola 400ml" style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.85rem;font-family:'Inter',sans-serif;outline:none;"/>
        </div>
        <div style="display:flex;gap:14px;">
          <div style="flex:1;">
            <label style="font-size:.75rem;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;">PRECIO</label>
            <input type="number" placeholder="$0" style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.85rem;font-family:'Inter',sans-serif;outline:none;"/>
          </div>
          <div style="flex:1;">
            <label style="font-size:.75rem;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;">CANTIDAD</label>
            <input type="number" placeholder="0" style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.85rem;font-family:'Inter',sans-serif;outline:none;"/>
          </div>
        </div>
        <button class="action-btn btn-purple" style="margin-top:6px;">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Guardar producto
        </button>
      </form>
    </div>
    <p style="font-size:.78rem;color:var(--muted);max-width:640px;">Próximamente: código de barras autogenerado, categorías (unitario / conjunto) y creación de nuevas categorías.</p>

  </main>
</div>
<script>
  (function() {
    const rol = localStorage.getItem('rol');
    const username = localStorage.getItem('username');
    if (username) {
      const nameEl = document.querySelector('.user-name');
      if (nameEl) nameEl.textContent = username;
    }
    if (rol !== 'Administrador') {
      document.querySelectorAll('.nav-item').forEach(item => {
        if (item.getAttribute('href') && item.getAttribute('href').includes('getion_usuario')) {
          item.style.display = 'none';
        }
      });
    }
  })();
</script>

  <script src="/frontend/assets/js/sidebar.js"></script>
</body>
</html>
